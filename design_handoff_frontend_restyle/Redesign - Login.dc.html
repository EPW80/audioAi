<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #141416; }
  </style>
</helmet>
<div data-screen-label="Login (redesign)" style="min-height: 100vh; background: #141416; color: #EDEDEF; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column;">

  <!-- Header -->
  <header style="background: #1B1B1E; border-bottom: 1px solid #2A2A2F;">
    <div style="max-width: 1120px; margin: 0 auto; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between;">
      <a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #EDEDEF;">
        <span style="display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 6px; background: #E8933A;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; width: 15px; height: 15px; color: #191006;"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></span>
        <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em;">AudioAI</span>
      </a>
      <nav style="display: flex; align-items: center; gap: 8px;">
        <button style="white-space: nowrap; font-weight: 500; font-size: 13px; line-height: 20px; padding: 7px 14px; border-radius: 6px; background: transparent; color: #A3A3AB; border: 1px solid #2A2A2F; cursor: pointer; transition: all 0.15s; font-family: 'IBM Plex Sans', sans-serif;" style-hover="color: #EDEDEF; border-color: #3A3A41;">Back to home</button>
      </nav>
    </div>
  </header>

  <!-- Form -->
  <div style="flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 88px 24px 64px 24px;">
    <div style="width: 400px;">
      <div style="background: #1B1B1E; border: 1px solid #2A2A2F; border-radius: 12px; padding: 32px;">
        <h1 style="font-size: 22px; line-height: 28px; font-weight: 600; margin: 0 0 6px 0; letter-spacing: -0.01em;">Welcome back</h1>
        <p style="font-size: 14px; line-height: 20px; color: #A3A3AB; margin: 0 0 28px 0;">Sign in to your projects and exports.</p>
        <form onSubmit="{{ noop }}" style="display: flex; flex-direction: column; gap: 18px;">
          <div>
            <label for="email" style="display: block; font-size: 13px; line-height: 18px; font-weight: 500; margin-bottom: 6px; color: #A3A3AB;">Email</label>
            <input id="email" type="email" placeholder="you@example.com" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 6px; outline: none; background: #101012; border: 1px solid #2A2A2F; color: #EDEDEF; font-size: 14px; line-height: 20px; font-family: 'IBM Plex Sans', sans-serif; transition: border-color 0.15s;" style-focus="border-color: #E8933A;">
          </div>
          <div>
            <label for="password" style="display: block; font-size: 13px; line-height: 18px; font-weight: 500; margin-bottom: 6px; color: #A3A3AB;">Password</label>
            <input id="password" type="password" placeholder="••••••••" style="width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 6px; outline: none; background: #101012; border: 1px solid #2A2A2F; color: #EDEDEF; font-size: 14px; line-height: 20px; font-family: 'IBM Plex Sans', sans-serif; transition: border-color 0.15s;" style-focus="border-color: #E8933A;">
          </div>
          <button type="submit" style="white-space: nowrap; width: 100%; font-weight: 600; font-size: 14px; line-height: 20px; padding: 11px 0; border-radius: 6px; background: #E8933A; color: #191006; border: none; cursor: pointer; transition: background 0.15s; margin-top: 4px; font-family: 'IBM Plex Sans', sans-serif;" style-hover="background: #F2A44E;">Sign in</button>
        </form>
      </div>
      <p style="text-align: center; margin: 20px 0 0 0; color: #A3A3AB; font-size: 14px; line-height: 20px;">
        Don't have an account?
        <button style="background: none; border: none; padding: 0; cursor: pointer; font-size: 14px; font-weight: 500; color: #E8933A; transition: color 0.15s; font-family: 'IBM Plex Sans', sans-serif;" style-hover="color: #F2A44E;">Create one</button>
      </p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 800}}">
class Component extends DCLogic {
  renderVals() {
    return { noop: (e) => e.preventDefault() };
  }
}
</script>
</body>
</html>
